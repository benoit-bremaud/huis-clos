# SonarQube analysis for the Huis Clos monorepo (self-hosted instance, local scan).
# Run from the repo root: `pnpm sonar`. Needs `sonar-scanner` on PATH and SONAR_TOKEN (global analysis token).
# Mobile and shared have no tests yet (#41): their lcov files are missing and they report 0 % coverage.
sonar.projectKey=huis-clos
sonar.projectName=Huis Clos
sonar.host.url=http://localhost:9000

sonar.sources=apps/backend/src,apps/mobile/src,packages/shared/src
sonar.tests=apps/backend/src,apps/mobile/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.module.ts,apps/backend/src/main.ts,packages/shared/src/index.ts

sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/mobile/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.sourceEncoding=UTF-8
