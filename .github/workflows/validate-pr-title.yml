name: Validate PR Title

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate PR title format
        shell: bash
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          echo ""
          
          # Check if title matches conventional commit format
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+ ]]; then
            echo "❌ Invalid PR title format"
            echo ""
            echo "Expected format: type(scope): subject"
            echo "Examples:"
            echo "  - feat(auth): implement jwt refresh token flow"
            echo "  - fix(profile): resolve avatar upload timeout"
            echo "  - docs(contributing): add branching policy"
            echo ""
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          
          echo "✅ PR title is valid"
